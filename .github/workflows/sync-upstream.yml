name: Sync upstream paperless-ngx

# Periodically merges paperless-ngx/paperless-ngx's dev branch into this
# fork's dev branch and opens a PR for review, instead of committing
# directly. Because the jpn Tesseract-language commit (b75f70c, "change
# default tesseract languages to include jpn") already lives in dev's
# history, a normal merge keeps it intact automatically - this workflow
# does not need to reapply or cherry-pick it. The only time that
# assumption breaks is if the merge conflicts on the same Dockerfile
# lines, which is handled below by opening an issue instead of a PR.

on:
  schedule:
    # Every Monday at 06:00 UTC. Adjust as you like - this repo's own
    # history shows upstream merges happening every 1-3 months, so even
    # monthly would keep pace; weekly just means smaller diffs to review.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/paperless-ngx/paperless-ngx.git

      - name: Fetch upstream
        run: git fetch upstream dev

      - name: Check for new upstream commits
        id: check
        run: |
          if [ "$(git rev-list --count dev..upstream/dev)" -eq 0 ]; then
            echo "No new upstream commits."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create sync branch
        if: steps.check.outputs.has_changes == 'true'
        run: |
          BRANCH="sync-upstream-$(date +%Y%m%d)"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"

      - name: Merge upstream/dev
        if: steps.check.outputs.has_changes == 'true'
        id: merge
        run: |
          if git merge upstream/dev --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Push sync branch
        if: steps.check.outputs.has_changes == 'true' && steps.merge.outputs.conflict == 'false'
        run: git push origin "$BRANCH"

      - name: Open pull request
        if: steps.check.outputs.has_changes == 'true' && steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "Sync with upstream paperless-ngx ($(date +%Y-%m-%d))" \
            --body "Automated merge of \`paperless-ngx/paperless-ngx:dev\` into this fork's \`dev\`. The jpn Tesseract-language change (b75f70c) is carried forward automatically since it's already part of \`dev\`'s history - please still skim the diff, especially around the Dockerfile's tesseract-ocr package list, before merging."

      - name: Open conflict issue
        if: steps.check.outputs.has_changes == 'true' && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Manual merge needed: upstream sync conflicts with jpn Dockerfile change" \
            --body "The scheduled upstream sync couldn't merge \`paperless-ngx/paperless-ngx:dev\` cleanly - most likely a conflict in the Dockerfile's tesseract-ocr package list where the jpn change lives. Resolve by hand:

            \`\`\`
            git checkout dev
            git remote add upstream https://github.com/paperless-ngx/paperless-ngx.git 2>/dev/null || true
            git fetch upstream dev
            git checkout -b sync-upstream-manual
            git merge upstream/dev
            # Resolve conflicts, keeping tesseract-ocr-jpn active and
            # tesseract-ocr-deu/fra/ita/spa commented out in the Dockerfile.
            git add -A
            git commit
            git push origin sync-upstream-manual
            \`\`\`

            Then open a PR from \`sync-upstream-manual\` into \`dev\`."
